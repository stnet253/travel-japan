# 不需要外部查證的固定內容：新手 SOP、日文對照、應變手冊。build 時與 guide.yml 合併顯示
sections:
  - id: sop
    label: 流程
    title: 完全新手 SOP：照著做就能來回
    intro: 把整趟旅行拆成四個時間點，每個時間點做完打勾。做完這張清單，到現場 90% 的事都已經處理好了。
    steps_title: 出發前 30 天
    steps:
      - 確認護照效期超過回國日 6 個月；台灣護照入境日本 90 天內免簽，不用辦任何簽證。
      - 訂機票（見「航空」段），訂完把電子機票 PDF 存進手機「檔案」App，不要只留在 Email。
      - 訂新宿西口飯店，選「新宿駅 西口 徒歩 10 分以內」且有「荷物預かり（行李寄放）」。
      - 線上買 N'EX 來回券與東京国立博物館門票（見各段步驟），把確認信截圖存到手機相簿「日本」資料夾。
      - 下載 App：Google Maps（離線下載東京地圖）、Google 翻譯（下載日文離線包，相機翻譯菜單用）、Suica（iPhone 用 Wallet 直接加）、小田急 EMot、Visit Japan Web 網頁加到主畫面。
      - 開通手機漫遊或買 eSIM（台灣電信 5 天方案約 NT$300–500），確認到日本第一天就有網路，沒有網路這份行程打不開。
      - 查 2027 年新宿御苑櫻花季預約規則（fng.or.jp，約 2 月公布），若週六要白天入園就預約。
    tips:
      - 出發前 7 天：填 Visit Japan Web（入境＋海關），拿到兩個 QR 截圖；查 weather MCP 預報決定帶不帶厚外套；中目黒晚餐線上預約；台灣先換 ¥30,000 現金（每人）。
      - 前一天：手機存好「飯店地址日文版」與「飯店電話」；護照、現金、信用卡（Visa 或 Mastercard 各一張，不同銀行）、行動電源放隨身包；把這個網站加到手機主畫面。
      - 當天出門前：再看一次第一天時間軸，確認班機時間後重新推算 N'EX 班次；行李箱貼好名牌。
  - id: vocab
    label: 日文
    title: 車站與售票機會看到的日文
    intro: 不用學日文，只要認得這些字。售票機與閘門幾乎都有「中文」按鈕，找到「言語／Language」先切換。
    rows:
      - { item: 切符・きっぷ, detail: 車票。售票機上方大字「きっぷ」就是買票的機器。, price: "", how: "找「きっぷうりば」（售票處）" }
      - { item: 乗車券, detail: 基本車票（搭車的錢）。搭特急還要再加「特急券」。, price: "", how: "N'EX 票上會同時印兩種" }
      - { item: 特急券・指定席, detail: 特急加價券；指定席＝對號座，自由席＝自由座。N'EX 全車指定席。, price: "", how: "看票上「○号車 ○番○席」就是車廂與座位" }
      - { item: 片道・往復, detail: 單程・來回。, price: "", how: "" }
      - { item: 大人・小人（こども）, detail: 成人・兒童（6–11 歲）。, price: "", how: "售票機按人數時會分這兩種" }
      - { item: チャージ, detail: IC 卡加值。所有車站售票機都能加，只收現金（1,000 日圓紙鈔起）。, price: "", how: "選「チャージ」→ 放卡 → 投鈔票 → 取卡" }
      - { item: 精算・のりこし精算機, detail: 補票機。出站時閘門不開、顯示金額不足，就到旁邊補票機補。, price: "", how: "放卡或票 → 顯示差額 → 付錢" }
      - { item: 改札（口）, detail: 剪票口／閘門。IC 卡輕碰藍色感應區，紙票插進去再從前方取回。, price: "", how: "進站「入場」、出站「出場」都要碰卡" }
      - { item: ○番線, detail: 第○月台。時間軸寫的「7 番線」就是 7 號月台。, price: "", how: "看頭頂黃色或藍色看板" }
      - { item: 方面・行き, detail: 往○○方向・終點站○○。山手線看板會寫「渋谷・品川方面」。, price: "", how: "搭車前核對終點站是否在你要去的方向" }
      - { item: 当駅始発, detail: 本站始發車，一定有座位。, price: "", how: "" }
      - { item: 乗り換え・のりかえ, detail: 轉乘。, price: "", how: "跟著「のりかえ」黃色指標走" }
      - { item: 出口・東口／西口／南口, detail: 出口・東／西／南出口。新宿駅出錯口會多走 15 分鐘。, price: "", how: "出閘門前先看黃色看板找正確出口" }
      - { item: 快速・急行・各停（各駅停車）, detail: 快車・急行・每站都停。急行不一定停小站，查好再上。, price: "", how: "時間軸已寫明該搭哪一種" }
      - { item: 女性専用車, detail: 女性專用車廂（平日早上尖峰 7:30–9:30 左右），男性別上。, price: "", how: "車門旁與月台地面有粉紅標示" }
      - { item: 優先席, detail: 博愛座。, price: "", how: "" }
      - { item: 荷物預かり・コインロッカー, detail: 行李寄放・投幣置物櫃（大型 ¥700–1,000／日）。, price: "", how: "" }
      - { item: お通し, detail: 居酒屋入座小菜，每人 ¥300–500，必收。, price: "", how: "不是算錯帳" }
      - { item: 免税・タックスフリー, detail: 免稅櫃台。, price: "", how: "結帳前說「めんぜい おねがいします」" }
  - id: phrases
    label: 會話
    title: 只要會這十句
    rows:
      - { item: すみません, detail: 不好意思／請問（叫店員、問路都用這句開頭）。, price: "", how: "su-mi-ma-sen" }
      - { item: これ ください, detail: 請給我這個（指著菜單或商品）。, price: "", how: "ko-re ku-da-sai" }
      - { item: ○○は どこですか, detail: ○○在哪裡？（把地名寫在手機上給對方看最快）。, price: "", how: "wa do-ko de-su-ka" }
      - { item: 新宿に 行きたいです, detail: 我想去新宿。, price: "", how: "ni i-ki-tai de-su" }
      - { item: カードで お願いします, detail: 我要刷卡。, price: "", how: "ka-a-do de o-ne-gai shi-ma-su" }
      - { item: 現金で, detail: 付現金。, price: "", how: "gen-kin de" }
      - { item: 二人です, detail: 兩位（進餐廳時比 2）。, price: "", how: "fu-ta-ri de-su" }
      - { item: 免税 できますか, detail: 可以免稅嗎？, price: "", how: "men-zei de-ki-ma-su-ka" }
      - { item: トイレは どこですか, detail: 廁所在哪？, price: "", how: "" }
      - { item: 助けて ください, detail: 請幫幫我（緊急時）。, price: "", how: "ta-su-ke-te ku-da-sai" }
  - id: trouble
    label: 応変
    title: 出狀況的時候
    intro: 每一種狀況都有一個「現在該做的第一件事」。先做那件事，再看第二步。
    rows:
      - { item: 錯過 N'EX, detail: 來回券的指定席作廢，但票仍可搭「同日後續班次的自由席」或改搭下一班（需到窗口改簽）。, price: "¥0", how: "第一件事：到 JR 綠色窗口（みどりの窓口）出示票說「次の N'EX に 変更できますか」。或改走 JR 山手線→日暮里→京成 Skyliner（Skyliner ¥2,580＋JR，合計約 ¥2,840）。" }
      - { item: 搭錯方向, detail: 東京地鐵與 JR 幾乎都是雙向對開，下一站下車走到對面月台搭回來即可，不用出站、不用多付錢。, price: "¥0", how: "第一件事：下車，看頭頂看板找反方向月台。" }
      - { item: IC 卡餘額不足出不了站, detail: 閘門關起來並顯示金額。, price: "差額", how: "第一件事：旁邊找「精算機」放卡補差額，或直接在閘門邊的站務員窗口給他卡，他會幫你處理。" }
      - { item: 迷路, detail: 東京車站出口多，走錯出口很正常。, price: "¥0", how: "第一件事：打開 Google Maps 按「步行」導航到目的地，跟著藍點走。還是不行就回到車站找「案内所」或站務員，出示手機上的目的地名稱。" }
      - { item: 下雨整天, detail: 每天都有 plan_b。, price: "", how: "第一件事：看當天時間軸每個節點的「備案」欄位，整天改室內版：Day 2 博物館延長、Day 4 改 teamLab Planets（需先線上買票）、Day 5 改銀座。" }
      - { item: 身體不舒服, detail: 便利商店有基本成藥，藥妝店（マツモトキヨシ、ウエルシア）有藥劑師。, price: "", how: "第一件事：輕症到藥妝店出示症狀的中文翻譯；發燒或嚴重到飯店櫃台請他們叫醫院或撥 119（救護車免費，醫療費自付，記得買旅平險）。" }
      - { item: 護照遺失, detail: 需要到警察局報案後到代表處補發「入國證明書」。, price: "", how: "第一件事：到最近的「交番」（派出所）報案拿「遺失届受理番号」；第二步打給台北駐日經濟文化代表處 +81-3-3280-7811（港區白金台），帶 2 張照片與報案號。" }
      - { item: 錢包／信用卡遺失, detail: 先停卡。, price: "", how: "第一件事：打回台灣銀行 24 小時客服停卡（出發前把客服電話存進手機）；日本的 7-Eleven ATM 可用另一張卡領現。" }
      - { item: 手機沒電, detail: 這份行程、票、地圖都在手機裡。, price: "", how: "第一件事：帶行動電源出門；萬一都沒電，便利商店有租借行動電源 ChargeSPOT（¥165 起／30 分，需 App）。備案：把每天時間軸列印一份放包包。" }
      - { item: 電車因事故停駛, detail: 日本常見，看板會顯示「運転見合わせ」。, price: "", how: "第一件事：不要等，打開 Google Maps 重新查路線，它會自動避開停駛路線；多數情況改搭平行的地鐵線即可。" }
      - { item: 餐廳客滿, detail: 櫻花季週末常見。, price: "", how: "第一件事：看該節點「備案」欄；通用解法是走進任何一家百貨公司高樓層（レストラン街），一定有位子。" }
      - { item: 地震, detail: 東京每年都有感地震，多數幾秒鐘結束。, price: "", how: "第一件事：在室內就蹲下護頭、遠離玻璃；電車會自動停駛再恢復；手機會收到緊急警報（很大聲，不用慌）。" }
