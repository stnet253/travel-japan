- id: departure
  label: 出国
  title: 回程那天，傍晚五點前就要站在報到櫃台前
  intro: 回程 2027-03-31（三）約 20:00 起飛。成田官方建議起飛前 2 小時以上到機場；但 2026-11 起免稅改為退稅制，要在託運行李前先到退稅機辦手續，本行程建議提早到 3 小時。行動電源規定 2026-04-24 起又收緊，打包前一定要看。
  verdict: 17:00 前抵達成田，先辦退稅確認、再報到託運，18:30 前過安檢出境。
  figures:
  - img: "/assets/img/narita.jpg"
    caption: 成田報到櫃台位置：T1 在 4F、T2 在 3F、T3 在 2F。
  rows:
  - item: 抵達時間
    detail: 成田官方：出發 2 小時以上前到達；實際依各航空報到開始時間。
    price: "—"
    how: 20:00 起飛 → 建議 17:00 到達（含退稅手續與排隊）。
    url: https://www.narita-airport.jp/ja/airportguide/inter-dep/
  - item: 報到櫃台樓層
    detail: 第1ターミナル 4 階、第2ターミナル 3 階、第3ターミナル 2 階。櫃台位置每天可能變動，以館內看板為準。
    price: "—"
    how: 準備護照、電子機票、行李。
    url: https://www.narita-airport.jp/ja/airportguide/inter-dep/
  - item: T2 ⇄ T3 移動
    detail: 免費ターミナル連絡バス：T2→T3 約 6 分、T3→T2 約 3 分；也可走連絡通道，從空港第2ビル駅改札到 T3 2F 出發大廳約 13 分。
    price: 免費
    how: 從空港第2ビル駅出改札往 T2 方向，自動門前左側電扶梯上 1F，沿藍色步道直走。
    url: https://www.narita-airport.jp/ja/access/shuttlebus/
  - item: 液體限制
    detail: 國際線手提行李中，超過 100ml 容器的液體一律不可帶上機；100ml 以下容器裝進 1 公升以下夾鏈透明袋可帶。
    price: "—"
    how: 化妝水、醬油、酒類放託運行李。
    url: https://www.narita-airport.jp/ja/airportguide/security/liquid/
  - item: 行動電源（2026-04-24 新規）
    detail: 禁止託運；手提最多 2 個且每個 160Wh 以下；機上不可替行動電源充電、也不可用行動電源替其他裝置充電。2025-07-08 起另要求不可放座位上方置物櫃、須放在看得到的地方。
    price: "—"
    how: 放隨身包、塞前方座位下；航空公司規定更嚴時以航空公司為準。
    url: https://www.mlit.go.jp/report/press/kouku10_hh_000310.html
  steps_title: 成田出境步驟（以 T2 為例）
  steps:
  - 16:40 前後 N'EX 抵達空港第2ビル駅，出改札往上到 T2 3F 出發大廳；搭 T3 的捷星則依上表走連絡通道或搭接駁巴士。
  - 有免稅購物的人先別報到：在託運前的出發大廳找「免税手続」退稅機（キオスク端末），放護照讀取，畫面綠色代表完成，紅色則帶著商品到旁邊海關窗口檢查。
  - 到航空公司櫃台（看大廳的出發航班看板找櫃台英文字母區），出示護照與電子機票，託運行李，拿登機證與行李收據。
  - 前往保安検査場（安檢）：液體夾鏈袋、筆電、行動電源拿出來放籃子。
  - 安檢後是出國審查：走顔認証ゲート（臉部辨識閘門），護照放上讀取、看鏡頭即可；想要出境章需跟職員說。
  - 出國審查後看登機證上的登機口（Gate）號碼與登機時間，依看板前往；部分登機口距離較遠，請在登機時間前 30 分鐘到達。
  tips:
  - 退稅確認一定要在託運前做，行李一旦交給航空公司就不能拿回來，退稅也就作廢。
  - 長榮在 T1、捷星在 T3，回程搭 N'EX 要在正確的站下車：T1 是「成田空港」終點站，T2/T3 是前一站「空港第2ビル」。
  - 10000mAh 的行動電源約 37Wh，兩個人各帶 2 個沒問題，但機上不能拿來充手機，起飛前先把手機充飽。
