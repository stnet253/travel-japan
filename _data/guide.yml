- id: reserve
  label: 予約
  title: 出發前要先動手的三件事：御苑、博物館、teamLab
  intro: 新宿御苑 2025、2026 年都在櫻花滿開的週末實施日時指定預約，2026 年是在 3/2 開放購票。3/27 是週六，很可能被列為 2027 年的預約日，而行程 15:50 入園正好落在 10:00～16:00 的預約時段內。博物館不需要指定日期，提早買只是為了不排窗口。
  verdict: 2027 年 2 月底起每天看新宿御苑官網；若 3/27 列為預約日，一開放就買 15:30～16:00 時段，或把入園改到 16:00 之後免預約。
  steps_title: 新宿御苑 / 東京国立博物館 線上購票步驟
  steps:
  - "【新宿御苑・預約日】2027 年 2 月底～3 月初，打開環境省新宿御苑官網（policies.env.go.jp/national-garden/shinjukugyoen/）的お知らせ，找標題含「桜」「事前予約」的公告，確認 3/27（六）是否列為預約日。"
  - 公告裡會有連到 asoview 的「日時指定入園電子チケット」按鈕。注意不要點成「日時指定団体予約券」（那是 30 人以上團體用）。
  - 在 asoview 頁面選日期 2027-03-27，再選入園時段（15:50 入園請選含 15:30～16:00 的時段），票種選「一般」，數量 2。
  - 按購買後會要求登入，沒有帳號就用 Email 註冊 asoview 會員（可用 Google 帳號）。
  - 付款選信用卡（台灣發卡的 Visa/Master/JCB 通常可用）或 PayPay。完成後收到確認信，asoview 帳號的「チケット」頁面會出現 QR code。
  - 當天在入園門把手機 QR code 對著閘門讀取器即可入場，不必到售票口。截圖備用，以免現場網路不穩。
  - "【新宿御苑・非預約日】不用買任何票，直接在入園閘門刷 Suica／PASMO 等交通 IC 卡進場，最快。"
  - "【東京国立博物館】打開 asoview「東博コレクション展 前売り電子チケット」頁面，選「一般 1,000円」數量 2。這張票不指定日期，購買後 2 個月內有效，所以 2027-01-28 之後再買比較保險。"
  - 結帳時用信用卡、PayPay 或 Paidy 付款，取得 QR code。當天走正門，先過安檢，再直接到入口出示 QR code，不必排窗口。記得不要帶行李箱。
  - "【teamLab Planets】只能在官方チケットストア買。選日期與 30 分鐘一格的入場時段、成人人數，信用卡付款；票價隨日期浮動，週末較貴。不可退，但可在入場開始 2 小時前改時段最多 3 次。"
  tips:
  - 新宿御苑預約日只管 10:00～16:00 入園，16:00～17:30 入園免預約。如果搶不到票，把入園改到 16:00 也能進，只是只剩 1.5 小時。
  - 新宿御苑入口會翻手提包找酒，查到要寄放在入口；連罐裝氣泡酒也算。
  - 預約日當天不賣年間パスポート，窗口也不賣一般門票，沒有電子票就只能等 16:00。
  - 東京国立博物館 3/27 是週六開到 20:00；若時間允許，把博物館排在週六傍晚，比週日下午人少。
  - 鎌倉大仏胎内 16:30 就關，比大仏本身早半小時；想進大佛肚子裡，16:20 前要排到胎内入口。
  - 千鳥ヶ淵划船的價格是以船計算，2 人共用一艘 30 分鐘 ¥1,500。滿開週末現場可能排 2～3 小時，10:00 開門前就去排最實際。
  - 江の島 3 段エスカー只負責上山，下山要走樓梯；若也想去岩屋，1day（¥1,550）比シーキャンドルセット券（¥1,100）＋岩屋單買 ¥500 便宜 ¥50。
  sources:
