    url: https://services.digital.go.jp/zh-cmn-hant/visit-japan-web/
  - name: Visit Japan Web 使用方法（繁中）
    url: https://services.digital.go.jp/zh-cmn-hant/visit-japan-web/guide/
  - name: Visit Japan Web 操作說明書（繁中）
    url: https://www.vjw.digital.go.jp/manual/main/visitjapanweb_manual_zh-cmn-Hant.html
