- id: money
  label: 金銭
  title: 信用卡為主、現金備用，網路落地就要通
  intro: 東京大部分商店、超商、車站都能刷 Visa、JCB、Mastercard，但小餐館、神社、商店街攤位仍常只收現金。日圓不夠時，7-Eleven 的セブン銀行 ATM 與郵局 ATM 都能用台灣發行的卡提款。
  verdict: 每人帶 ¥20,000～30,000 現金加兩張不同卡組織的信用卡，網路用 eSIM 或電信漫遊，出發前在台灣就設定好。
  figures:
  - img: "/assets/img/suica_card.jpg"
    caption: 交通與超商小額付款交給 IC 卡，大額交給信用卡，現金留給只收現金的小店。
  rows:
  - item: 7-Eleven セブン銀行 ATM
    detail: 全日本 7-Eleven 店內超過 28,000 台，可用 Visa、PLUS、Mastercard、Maestro、Cirrus、銀聯、AMEX、JCB、Discover、Diners 卡提領日圓；成田、羽田機場也有。
    price: ATM 手續費金額未查到（另有發卡行跨國手續費）
    how: 插卡 → 選語言「中文」→ 輸入密碼 → 選金額；需事先向台灣銀行開通跨國提款與設定 4 位數密碼。
    url: https://www.sevenbank.co.jp/intlcard/index2.html
  - item: ゆうちょ銀行（郵局）ATM
    detail: 可用 Visa、PLUS、Mastercard、Maestro、Cirrus、JCB、銀聯、Discover 卡。郵局內 ATM 平日 07:00–23:00、週日假日 07:00–21:00。
    price: 部分卡每次 ¥220（含稅）；單次上限 ¥50,000
    how: 郵局或部分 FamilyMart 內的小型 ATM 可用。
    url: https://www.jp-bank.japanpost.jp/en/ias/en_ias_index.html
  - item: 信用卡與行動支付
    detail: JNTO：海外信用卡在加盟店可用，日本最普及的是 Visa、JCB、Mastercard。Suica／PASMO 等 IC 卡可用於交通與超商。
    price: 海外刷卡手續費依發卡行（約 1.5% 上下，估計）
    how: Apple Pay 加入 Suica 最方便；IC 卡儲值只能用現金。
    url: https://www.japan.travel/en/plan/cashless-payments-in-japan/
  - item: eSIM／漫遊／Wi-Fi 機
    detail: 三種選擇：eSIM（手機需支援、需解鎖）、台灣電信日本漫遊方案、租 Wi-Fi 分享器（兩人可共用但要帶著走）。
    price: 5 天方案價格未查證，出發前比價
    how: eSIM 在台灣就先安裝好、落地再開啟數據漫遊；兩人分開行動時各自有網路較安全。
    url: https://www.japan.travel/en/plan/cashless-payments-in-japan/
  steps_title: 出發前要做的錢與網路設定
  steps:
  - 打給台灣發卡銀行（或用 App）開通「海外提款」功能，確認卡片有 4 位數磁條／晶片密碼。
  - 準備兩張不同卡組織的信用卡（例如一張 Visa、一張 JCB），一張放錢包一張放行李，避免同時遺失。
  - 在台灣銀行先換 ¥20,000～30,000 現金，落地當天的 N'EX 與晚餐不用急著找 ATM。
  - iPhone 打開「錢包」App → 加入「交通卡」→ 選 Suica，用信用卡儲值（Android 需支援 Osaifu-Keitai，否則買實體卡）。
  - 購買 eSIM 後在台灣先掃 QR 碼安裝，設定為「次要線路」，到日本落地後在「行動數據」切換到 eSIM 並開啟「數據漫遊」。
  tips:
  - 7-Eleven ATM 畫面可選中文，提款後記得把卡片拿回，機器會提示聲音。
  - 郵局 ATM 週日與假日只到 21:00，晚上要領錢找 7-Eleven 比較保險。
  - 日本刷卡時店員會問「一括（いっかつ）で？」，意思是一次付清，點頭說「はい」即可。
  sources:
  - name: Seven Bank ATM（海外發行卡）
    url: https://www.sevenbank.co.jp/intlcard/index2.html
  - name: ゆうちょ銀行 International ATM Service
    url: https://www.jp-bank.japanpost.jp/en/ias/en_ias_index.html
  - name: JNTO Cashless Payments in Japan
    url: https://www.japan.travel/en/plan/cashless-payments-in-japan/
- id: taxfree
  label: 免税
  title: 2026 年 11 月起，日本免稅改成先付錢、出境再退
  intro: 日本的消費稅免稅制度從 2026-11-01 購買分起改為「リファンド方式（退稅制）」，沒有新舊並行期，2027-03 的行程一定適用新制。在店裡要先付含稅價，出境時在機場經海關確認把商品帶出國後，才把消費稅退給你。
  verdict: 購物時留好收據、商品不要拆來用，回程 17:00 前到成田，託運前先在退稅機刷護照，退款方式在店裡結帳時就要問清楚。
  figures:
  - img: "/assets/img/narita.jpg"
    caption: 成田空港 第2ターミナル。退稅機設在出境大廳、託運行李之前，實際位置以現場「Tax Refund」指標為準。
  rows:
  - item: 舊制（～2026-10-31）
    detail: 在免稅店結帳時直接付稅抜價格。一般物品與消耗品分開計算，消耗品需特殊密封包裝且上限 ¥500,000。
    price: 下限：同店同日稅抜 ¥5,000 以上
    how: 出示護照當場免稅。
    url: https://www.mlit.go.jp/kankocho/tax-free/content/001977883.pdf
  - item: 新制（2026-11-01 購買分起）
    detail: 店內先付含稅價（課税）；購買日起 90 天內出境時，在機場退稅機出示護照接受海關確認，之後由免稅店或其委託的退款業者退還消費稅相當額。
    price: 下限維持：同一店鋪一天稅抜 ¥5,000 以上
    how: 結帳出示護照，店家會說明退款方式登錄。
    url: https://www.mlit.go.jp/kankocho/tax-free/page01_000001_00021.html
  - item: 消耗品規定改變
    detail: 一般物品／消耗品區分廢止；消耗品特殊包裝廢止；消耗品 ¥500,000 上限廢止。但食品、化妝品若在日本吃掉用掉，該張收據就無法退稅。
    price: 上限取消，數量以能自己全部帶出境為限
    how: 要退稅的東西別拆封使用。
    url: https://www.mlit.go.jp/kankocho/tax-free/page01_000001_00023.html
  - item: 退款方式
    detail: 官方舉例：銀行匯款、信用卡退款、App 匯款，或在出境機場內領現金；實際方式依各免稅店而異。
    price: 退還消費稅相當額（標準稅率 10%，食品等 8%；手續費依店家）
    how: 結帳時問店員「返金方法は？」（退款方式是？），依指示登錄。
    url: https://www.mlit.go.jp/kankocho/tax-free/page01_000001_00023.html
  - item: 需要帶的東西
    detail: 護照（有上陸許可貼紙）、該次購買的全部商品、收據等購買紀錄。Visit Japan Web 可登錄免稅 QR 碼，結帳時出示（不可用截圖）。
    price: "—"
    how: VJW「免稅」功能需先掃護照與上陸許可貼紙。
    url: https://services.digital.go.jp/zh-cmn-hant/visit-japan-web/guide/
  steps_title: 新制退稅四步驟
  steps:
  - 購物時：在有「Tax-Free」標誌的店，同店同日稅抜滿 ¥5,000，結帳出示護照（或 VJW 免稅 QR 碼），先付含稅價，問清楚並登錄退款方式（信用卡、匯款或機場現金等），收據收好。
  - 旅途中：要退稅的商品原封不動，不要吃、不要用；同一張收據裡只要少一樣，整張收據都不能退。
  - 回程 2027-03-31 抵達成田後，在託運行李前，到出發大廳的免稅手續端末（キオスク端末）放護照，畫面顯示綠色＝完成；紅色＝帶商品到旁邊海關檢查處給海關看。
  - 成田也可用 Visit Japan Web 線上辦理：在國際線出發大廳連上專用無線網路（安檢前區域），在手機上完成，取代退稅機。
  - 海關確認完成後，店家或退款業者依你登錄的方式退款；退款時間依店家，問題請洽購買店家。
  tips:
  - 藥妝零食若想在日本先吃，就和要帶回台灣的分開結帳，避免整張收據作廢。
  - 退稅機設在託運櫃台之前，行李託運後才想到要退稅就來不及了，航空公司不會把行李拿回來。
  - 因退稅手續耽誤而沒趕上飛機，官方明言航空公司與海關都不補償。
  sources:
