unverified:
- 各航空公司 2027-03-27／03-31 實際航班時刻與票價：本頁價格皆為 2026-10-16 的估計區間，需在官網或比價網實查。
- 樂桃 Peach 與捷星日本是否於 2027-03 仍執飛 TPE–NRT，以及 ZIPAIR 等其他航空是否有台北線，未逐一確認。
- 台灣虎航、樂桃、捷星的手提行李重量上限與託運行李加購金額未取得官網確切數字。
- 松山 TSA ⇄ 羽田 HND 的經營航空公司（一般認知為華航、長榮、日航、全日空）本次未查到官方來源。
- 各航空在成田的報到開始與截止時間（廉航通常較早截止），需依所訂航空官網確認。
- 退稅新制：成田機場退稅端末的實際位置、各店家可選的退款方式、退款手續費與入帳時間，觀光廳表示依各免稅店而異，需在購物時詢問。
- 退稅新制：VJW 線上退稅手續在成田的實際操作畫面與專用 Wi-Fi 名稱尚未查到。
- セブン銀行 ATM 對海外卡收取的手續費金額與單次提款上限未在官網取得。
- eSIM、電信漫遊、Wi-Fi 分享器的 5 天方案價格未查證。
- 入境審查時須按指紋與拍照為一般流程，出入國在留管理庁網站本次連線被拒（403），未能以官方頁面確認最新流程。
- 台灣端對行動電源的規定（民航局）與各航空公司是否更嚴格，需在出發前一個月再確認。
- 所有票價為 2026-10-16 官方現行值；JR 東日本 2026-03-14 已改定運賃，2027-03 前若再改定或 N'EX 來回券調價，需出發前 1 個月再查 jreast.co.jp。
- 成田 T2 的 JR 車站英文已改稱「Narita Airport Terminal 2・3 Station」，Yahoo!乗換案内仍顯示「空港第２ビル」；日文正式站名與現場標示需出發前確認。
- JR-EAST Train Reservation 會員註冊細節（是否需 Email 驗證碼、按鈕確切英文字樣）以實際畫面為準；官方說明頁截圖為示意。
- N'EX 來回券回程 3/31 新宿 15:30 前後的實際班次與指定席空位，需在乘車日 1 個月前（約 2027-03-01 起）上網劃位確認。
- Skyliner e-ticket 線上折扣價：官網價格以圖片呈現，未取得文字數字。
- 利木津巴士成田→新宿實際所需時間與 2027-03 時刻表未查到（官網時刻表需互動查詢）。
- 台灣發行的 Visa 信用卡能否在 Apple 錢包為 Suica 加值：僅有網友經驗談（非日本 Visa 有時被拒），官方未說明；建議準備 Mastercard、JCB 或 AMEX 備用，或改用車站售票機現金加值。
- Android 手機：台灣機型多半不支援 Google 錢包 Suica，未逐一確認型號；Android 使用者以實體卡為準。
- Welcome Suica 實體卡的初始儲值選項與發售金額，官方頁未列明；一般 Suica 實體卡在哪些售票機可買，官方英文頁未逐站列出。
- EMot App 內各按鈕的確切英文標示（搜尋、轉讓、群組票）以實際 App 為準。
- 小田急新宿站售票機「お得なきっぷ」選單的實際按鈕名稱未逐一查證。
- ヤマト空港宅急便 成田→新宿飯店的實際運費（依尺寸），官網價格需互動查詢未取得；當日配送服務的範例價（160 尺寸 ¥5,780）是羽田當日配，不適用成田。
- 末班車時間以 2026-10 平日時刻表查得，2027-03 時刻改正（通常在 3 月中旬）後需重查；3/28 為週日，假日時刻表較早收班。
- Day 3 中目黒→新宿的 ¥252 為東急東横線直通副都心線經新宿三丁目轉丸ノ内線的組合，實際走法可能因直通班次而異。
- 新宿御苑 2027 年櫻花季預約日尚未公布：2026 年公告在 3/2 發布（fng.or.jp 公告頁被防爬機制擋住，日期與規則轉引自部落格整理），2027 年預計 2 月底～3 月初公布，3/27（六）是否為預約日要到時候確認。
- 新宿御苑網頁抓取時沒有顯示票價表；¥500 是根據 asoview 官方委託販售頁與多篇 2026 年資料，出發前在官網再確認一次。
- asoview 的按鈕文字與畫面以 2026 年版本為準，2027 年可能改版；購票步驟中的按鈕名稱僅供參考。
- 東京都庁展望室「都庁舎点検日」的日期不固定，請在出發前查開室カレンダー PDF（zaimu.metro.tokyo.lg.jp/documents/d/zaimu/tenboukaishitsu-pdf）與 X @tocho_tenbou。
- 浅草寺おみくじ ¥100：官方沒有公布價格，以現場投幣箱標示為準。
- 明治神宮 3 月開閉門時間（約 5:40～17:20）與御苑 ¥500 引用自輔助來源，官方網站這次沒抓到對應頁面。
- 鎌倉大仏、長谷寺、鶴岡八幡宮宝物殿的付款方式（是否只收現金）官網沒有寫，請備日圓現金與硬幣。
- 千鳥ヶ淵ボート場：「觀櫻期」的確切起訖日、2027 年打燈期間是否只賣 60 分券（2026 年部落格寫打燈期 9:00～19:30 只賣 60 分券，官方頁沒寫）、現場付款方式、2027 年是否續辦スマートチケット，都要在 2027 年 3 月看 visit-chiyoda.tokyo 與 X @chidori_boat。
- 江の島岩屋 3 月的開放時間這次沒查到官方資料；江の島アートフェスティバル 2027 年開始日期也待公布（若提前到 3 月底，17:00 後進コッキング苑要另付 ¥500）。
- teamLab Planets 3/27～3/31 實際票價為浮動制，要進購票頁選日期才看得到；營運期官方寫「2027年末」，之後是否延長未定。
- 東京国立博物館本館閉室範圍可能變動，3/28 前再看一次官網「臨時閉室」公告。
