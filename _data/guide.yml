- id: arrival
  label: 入国
  title: 落地成田之前，先把 Visit Japan Web 填好
  intro: 台灣護照（有身分證字號）赴日觀光免簽，單次最長 90 天。入境要過入境審查、領行李、海關三關，Visit Japan Web（VJW）可以把入境審查與海關申報整合成手機 QR 碼，免填紙本。VJW 非強制，但事先填好通關快很多。
  verdict: 出發前一週用手機註冊 VJW、兩個人各自登錄，落地後照「入境審查 → 領行李 → 海關」三步出示 QR 碼即可。
  figures:
  - img: "/assets/img/narita_t2_station.jpg"
    caption: 出海關後往下走就是空港第2ビル駅，N'EX 從這裡出發。
  rows:
  - item: 免簽資格
    detail: 台灣居民持載有身分證統一編號的護照，以觀光等短期停留目的入境免簽，在留期間 90 天。需持有效護照並確保能返國。
    price: 免費
    how: 回程機票存在手機，入境審查官可能詢問。
    url: https://www.koryu.or.jp/visa/taipei/exemption/
  - item: Visit Japan Web
    detail: 日本數位廳的免費網頁服務，登錄入境審查與海關申報資料，入境時出示 QR 碼。註冊需要護照、機票、電子郵件。
    price: 免費
    how: 從 vjw-lp.digital.go.jp（會轉到 services.digital.go.jp）點「開始使用」。可用電腦登錄，但入境時須用手機出示 QR 碼。
    url: https://services.digital.go.jp/zh-cmn-hant/visit-japan-web/
  - item: 海關電子申報
    detail: 領完行李後到電子申報機掃 VJW 的海關 QR 碼與護照，再走電子申報閘門；沒用 VJW 就要填紙本「携帯品・別送品申告書」。
    price: 免費
    how: 沒有超過免稅範圍走綠色檢查台。
    url: https://www.customs.go.jp/kaigairyoko/egate.htm
  steps_title: Visit Japan Web 註冊與入境步驟
  steps:
  - STEP 0：手機瀏覽器打開 https://vjw-lp.digital.go.jp/ （會轉到數位廳頁面），右上切換「繁體中文」，按「開始使用」→「建立新帳號」，輸入 email、設密碼，到信箱收驗證碼完成註冊後登入。
  - STEP 1：按「本人資料」→ 選入境類別（外國人）→「使用相機讀取」掃護照照片頁（失敗就改「自行輸入」）→ 填基本資料（職業、台灣地址）。
  - STEP 1-2：同行另一人可在「同行家人」新增，或各自用自己的帳號登錄。
  - STEP 2：按「登錄入境・返回日本的預定」→ 填入境日期 2027-03-27、航空公司與航班編號 → 「在日本的聯絡處」填新宿西口飯店名稱、地址、電話（訂房確認信上有）。
  - STEP 3：點剛登錄的行程 →「入境審查以及海關申報」→ 逐題回答（攜帶物品、現金是否超過 100 萬日圓等），確認後送出。檢疫題目若有也一起回答。
  - 落地第一關 入國審查：走「外国人 Foreign Passports」的隊伍，出示護照與 VJW 入境審查 QR 碼，依指示按兩手食指指紋、拍臉部照片，護照貼上陸許可貼紙。
  - 第二關 領行李：看電子看板找航班編號對應的轉盤（ターンテーブル），用行李收據核對自己的箱子。
  - 第三關 海關：到電子申報機（電子申告端末）掃 VJW 海關 QR 碼與護照，再走電子申報閘門；未申報或有疑問走紅色檢查台。
  - 出海關到到著ロビー（入境大廳），T2 往 B1 走就是空港第2ビル駅，接 N'EX。
  tips:
  - VJW 的 QR 碼分「入境審查」和「海關申報」兩張，不要只截一張；在機場網路不穩時，事先把 VJW 加到主畫面可離線顯示。
  - 護照上陸許可貼紙不要撕，之後免稅購物與 VJW 免稅 QR 碼都會用到。
  - 肉類（含肉乾、肉鬆、含肉泡麵）不能帶入日本，台灣伴手禮請避開。
  sources:
