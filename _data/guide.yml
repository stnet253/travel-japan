    url: https://apps.apple.com/us/app/welcome-suica-mobile/id6738336566
- id: city-pass
  label: 周遊
  title: 算過才知道，這趟東京不需要地鐵通票
  intro: Tokyo Subway Ticket 可在 24／48／72 小時內無限搭東京メトロ與都営地下鉄全線，但不含 JR、東急、小田急。我們把五天每段車資用 IC 卡運賃加總：真正搭地鐵的日子只有第 2 天和第 5 天，而且單日地鐵花費都不到 ¥1,000。
  verdict: 不買。整趟市區車資每人約 ¥2,163（含 JR、東急），其中地鐵部分單日最多 ¥778，連 24 小時券 ¥1,000 都回不了本，直接刷 IC 卡最划算。
  figures:
  - img: "/assets/img/shinjuku_sta.jpg"
    caption: 新宿站，JR、小田急、京王、東京メトロ、都営地下鉄交會
  rows:
  - item: Tokyo Subway 24-hour Ticket
    detail: 使用開始起 24 小時，東京メトロ全線＋都営地下鉄全線；不含 JR、東急、小田急、京成。
    price: "¥1,000（大人）／¥500（兒童）"
    how: 訪日外國人：都営大江戸線新宿西口駅、浅草線新橋駅、大江戸線上野御徒町駅的 Tourist Information Center（8:00–20:00，須出示護照），或官方網站買 QR 版再到指定售票機換票；機場觀光服務處與家電量販店也有賣。
    url: https://www.kotsu.metro.tokyo.jp/subway/fare/otoku_limited.html
  - item: Tokyo Subway 48-hour Ticket
    detail: 同上，使用開始起 48 小時。
    price: "¥1,500（大人）／¥750（兒童）"
    how: 同上。
    url: https://www.tokyometro.jp/tcn/ticket/travel/index.html
  - item: Tokyo Subway 72-hour Ticket
    detail: 同上，使用開始起 72 小時。
    price: "¥2,000（大人）／¥1,000（兒童）"
    how: 同上；京成另有 Skyliner＋Subway Ticket 套票。
    url: https://www.tokyometro.jp/tcn/ticket/travel/index.html
  - item: 試算 Day 2（新宿→浅草→上野、日暮里→秋葉原→新宿）
    detail: 新宿→浅草 丸ノ内線轉銀座線 ¥252；浅草→上野 銀座線 ¥178；日暮里→秋葉原 JR 山手線 ¥199；秋葉原→新宿 JR 總武線 ¥209。地鐵部分 ¥430。
    price: IC 合計 ¥838／人
    how: 全程刷 IC 卡。
    url: https://transit.yahoo.co.jp/
  - item: 試算 Day 3（新宿→原宿、渋谷→中目黒→新宿）
    detail: 新宿→原宿 JR 山手線 ¥155；渋谷→中目黒 東急東横線 ¥140；中目黒→新宿 東急東横線直通副都心線經新宿三丁目約 ¥252（含東急段，通票不適用東急）。
    price: IC 合計 ¥547／人
    how: 全程刷 IC 卡。
    url: https://transit.yahoo.co.jp/
  - item: 試算 Day 5（新宿→築地市場→九段下→新宿）
    detail: 新宿→築地市場 都営大江戸線直達 ¥272；築地市場→九段下 大江戸線轉東京メトロ東西線（門前仲町）¥286；九段下→新宿 都営新宿線直達 ¥220。三段都是地鐵。
    price: IC 合計 ¥778／人
    how: 刷 IC 卡；即使買 24 小時券也虧 ¥222。
    url: https://transit.yahoo.co.jp/
  - item: 結論：五天市區車資總和
    detail: Day 1 與回程用 N'EX 來回券、Day 4 用江の島・鎌倉フリーパス，不計入。Day 2＋3＋5 合計每人 ¥2,163，地鐵可涵蓋部分約 ¥1,200 且分散在不連續的日子。
    price: "¥2,163／人（兩人 ¥4,326）"
    how: 每人 IC 卡先儲值 ¥3,000，涵蓋車資與便利商店小額消費。
    url: https://transit.yahoo.co.jp/
  steps_title: 如果仍想買 Tokyo Subway Ticket（例如臨時增加地鐵行程）
  steps:
  - 住新宿西口最近的實體售票點是都営大江戸線「新宿西口駅」的 Tourist Information Center，8:00–20:00，帶護照。
  - 或在官方網站（tokyometrods.triplabo.com，可選英文）線上購買 QR 版，一人一張，可把多買的票轉送到同行者手機。
  - QR 版要到支援 QR 發券的地鐵售票機換成實體票，或依網站說明直接使用；支援站點見都営交通局公告的 PDF 地圖。
  - 實體票第一次通過驗票閘門才開始計時；PASMO 版則從購買時起算。
  tips:
  - 東急東横線（渋谷→中目黒）與 JR 山手線都不在通票範圍，這兩段最常讓人以為買了通票就全包。
  - 都営與東京メトロ互轉時，IC 卡會自動套用轉乘折扣，像築地市場→九段下就只算 ¥286。
  - Yahoo!乗換案内的 IC 運賃與實際扣款一致，到現場想確認可用 Google Maps 看大概，但金額以 IC 運賃為準。
  sources:
