- id: kamakura-pass
  label: 鎌倉
  title: 一張フリーパス，從新宿坐到海邊再坐回來
  intro: 小田急的「江の島・鎌倉フリーパス」包含新宿到藤沢的來回各一次，加上藤沢～片瀬江ノ島的小田急線與江ノ電全線一日無限搭。手機版在 EMot 購買，掃 QR code 過閘門；紙本在小田急新宿站售票機就能買。
  verdict: 買。依第 4 天路線（新宿→藤沢→江ノ電→鎌倉→江ノ島→片瀬江ノ島→新宿）IC 逐段加總每人 ¥1,826，フリーパス ¥1,640，每人省 ¥186，中途多下車一次省更多；坐快速急行不加錢。
  figures:
  - img: "/assets/img/odakyu_train.jpg"
    caption: 小田急線快速急行，新宿始發直達藤沢，不需特急券
  - img: "/assets/img/enoden_car.jpg"
    caption: 江ノ電車廂，鎌倉高校前一帶沿海行駛
  - img: "/assets/img/katase_enoshima_station.jpg"
    caption: 小田急片瀬江ノ島駅，回程從這裡上車
  rows:
  - item: 江の島・鎌倉フリーパス（新宿發）
    detail: 1 日有效。含小田急線新宿～藤沢來回各一次（中途下車要告知站員），藤沢～片瀬江ノ島與江ノ電全線無限搭，另附沿線景點、咖啡店優惠。超出範圍要補差額。紙本在旅程結束站回收。
    price: "¥1,640（大人）／¥430（兒童）"
    how: EMot App 或 EMot Online Tickets（手機網頁）購買數位版；或小田急各站售票機、窗口、小田急旅行中心購買紙本。
    url: https://www.odakyu-freepass.jp/enokama/buy.html
  - item: 逐段 IC 運賃加總（比較用）
    detail: 新宿→藤沢 小田急 ¥607；藤沢→鎌倉 江ノ電 ¥310；鎌倉→江ノ島 江ノ電 ¥260；片瀬江ノ島→新宿 小田急 ¥649。
    price: "¥1,826／人"
    how: フリーパス每人省 ¥186；若在長谷、鎌倉高校前多下車一次，每次再多省約 ¥200。
    url: https://transit.yahoo.co.jp/
  - item: 快速急行
    detail: 小田急一般列車（有「快速急行」字樣、藍色系車身），不收特急費，フリーパス直接搭。新宿 4、5 番線常見「藤沢行」始發，約 56 分到藤沢。
    price: 不加價
    how: 直接過閘門上車。
    url: https://www.odakyu-freepass.jp/enokama/
  - item: 浪漫特急（ロマンスカー）加購特急券
    detail: 全車指定席。新宿→藤沢、新宿→片瀬江ノ島的特急費相同；上車前沒買，車上補票要多付 ¥350。往江ノ島方向的班次很少。
    price: "¥700（網路チケットレス）／¥750（窗口、售票機）"
    how: EMot Online Tickets 或小田急網站購買特急券，或在站內售票機買；フリーパス只抵車資，特急費另付。
    url: https://www.odakyu.jp/romancecar/charges/shinjuku_katase_enoshima/index.html
  - item: 江ノ電 1 日乗車券「のりおりくん」
    detail: 只含江ノ電全線一日無限搭，不含小田急。第 4 天江ノ電只搭藤沢→鎌倉、鎌倉→江ノ島兩段共 ¥570，買のりおりくん反而多花。
    price: "¥800（大人）／¥400（兒童）"
    how: 江ノ電全站售票機；或 EMot 數位版。
    url: https://www.enoden.co.jp/tourism/ticket/noriorikun/
  steps_title: 購買方式：EMot 數位版與新宿站售票機
  steps:
  - "【數位版】在 App Store 或 Google Play 下載「EMot」，或用手機瀏覽器開 EMot Online Tickets（https://www.emot-tickets.jp/），把語言切到 English。"
  - 用 Email 或 Google 帳號註冊並登入。之後要用同一種方式登入才看得到票，Email 大小寫也要一致。
  - 搜尋「Enoshima-Kamakura Freepass」（デジタル江の島・鎌倉フリーパス），出發站選「新宿」（Shinjuku），選使用日期，用信用卡付款。乘車日前 1 個月起可購買。
  - 這張票原則上一支手機一張、一人一份；兩人可各自用手機買，或由一人購買後用「轉讓」功能傳給同行者，也可用「群組票」功能讓一支手機帶最多 4 人（全員同一行程）。
  - 當天在小田急新宿站閘門，打開票券畫面顯示 QR code，對準閘門或有人窗口上的 QR 讀取機；江ノ電無人站用藍色簡易閘機上的讀取端末，有人站走站員窗口，不能用自動閘門。
  - "【紙本】到小田急新宿站西口地上的小田急線售票機，選畫面上的「English」或中文按鈕，找「お得なきっぷ／Discount tickets」→「江の島・鎌倉フリーパス」，選大人 2 張；可付現金、IC 卡或 Visa、Mastercard、JCB、AMEX、Diners 信用卡。售票機只賣當天有效的票。"
  - 紙本票每段都插進閘門再取回，最後在新宿出站時會被回收。
  tips:
  - 在 JR 鎌倉站要走江ノ電的西口驗票口進出，フリーパス不能用 JR 鎌倉站東口通過。
  - 小田急段（新宿～藤沢）只能來回各一次，想中途下車（例如町田）要先跟站員說，別直接過閘門。
  - 因天候停駛導致完全沒搭到的交通工具，可在旅程結束站退回那一段的錢。
  - 快速急行常停在新宿 4、5 番線，看月台電子看板寫「快速急行 藤沢」再上車；同月台的「小田原行」要在相模大野轉車。
  sources:
