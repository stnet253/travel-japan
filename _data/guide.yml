- id: admission
  label: 入場
  title: 門票多半在現場刷卡就好，只有御苑週末那張要提早搶
  intro: 這趟會經過的寺社與庭園，大多數是免費或幾百日圓的拝観料，在門口買就行。真正會卡住人的只有三件事：新宿御苑櫻花季週末的日時指定預約、千鳥ヶ淵划船的排隊，以及 teamLab 只賣線上票。下表依行程順序整理，價格都是官方網站 2026-10-16 查到的數字。
  verdict: 要先在網路上買的：新宿御苑（若 3/27 屬預約日）、teamLab Planets（現場不售票）；建議先買：東京国立博物館（省排隊）；其餘全部現場買，鎌倉兩寺請備零錢。
  figures:
  - img: "/assets/img/shinjuku_gyoen.jpg"
    caption: 新宿御苑的櫻花季週末，10:00～16:00 入園需事前購買日時指定電子票（2025、2026 年皆如此）
  - img: "/assets/img/chidorigafuchi.jpg"
    caption: 千鳥ヶ淵ボート場，觀櫻期 30 分鐘 1 艘 ¥1,500，滿開週末現場可能排 2～3 小時
  - img: "/assets/img/daibutsu.jpg"
    caption: 鎌倉大仏：拝観 ¥300，進入大佛內部（胎内）另付 ¥50，胎内 16:30 結束
  rows:
  - item: 新宿御苑（Shinjuku Gyoen）
    detail: 3/15～9/30 開園 9:00～18:00（最終入園 17:30）。平時週一休，但 3/25～4/24 櫻花特別開園期間每天開。櫻花季週末 10:00～16:00 入園採預約制（2026 年為 3/28、3/29、4/4、4/5）；9:00～10:00 與 16:00～17:30 入園免預約。園內禁止帶酒（入口會檢查手提包）、禁球類／飛盤／羽球／野餐帳篷與陽傘，櫻花期禁止跑步、禁用三腳架拍人像。
    price: "¥500"
    how: 平日：現場售票口，或入園閘門直接刷 Suica 等交通 IC 卡；也可在 asoview 先買不指定日期的電子票（購買後 6 個月內有效）。預約日：只能在 asoview 買日時指定電子票（信用卡／PayPay／Paidy），沒有票 10:00～16:00 進不去。
    url: https://policies.env.go.jp/national-garden/shinjukugyoen/guide/information/
  - item: 東京都庁 展望室（南・北）
    detail: 免費、不能預約。南展望室 9:30～22:00（最終入室 21:30），每月第 1、第 3 週二休；北展望室 9:30～17:30（最終入室 17:00），每月第 2、第 4 週一休。2027 年 3 月的休室日推算為南 3/2、3/16，北 3/8、3/22，所以 3/27～3/31 南北都開（另有不定期「庁舎点検日」與天候臨時關閉）。週末從第一本庁舎 1 樓正門進，搭展望室專用電梯；入室前有安檢，常排 20～30 分。禁用三腳架。
    price: 免費
    how: 直接排隊，不需票
    url: https://www.zaimu.metro.tokyo.lg.jp/tochousha/goannai/tenbou
  - item: 浅草寺（Sensō-ji）
    detail: 境內 24 小時可進，免費。本堂 6:00～17:00（10～3 月 6:30 開堂，所以 3/27～3/31 是 6:30）。雷門、五重塔等夜間打燈到約 23:00。
    price: 免費（おみくじ投幣，一般為 ¥100）
    how: 籤筒旁投幣箱，只能投日圓硬幣
    url: https://www.senso-ji.jp/
  - item: 東京国立博物館（TNM）東博コレクション展
    detail: 9:30～17:00；週五、週六開到 20:00（入館至閉館前 30 分）。3/28（日）營業到 17:00。官方已公告 2027-03-29（一）也開館。自 2026-08-01 起禁止攜帶行李箱入館（館內無行李寄放，請先寄放車站置物櫃）；自 9/8 起正門有金屬探測與手提包檢查。2026-12-14～2027-04-25 本館 2～3 室、2026-10-26～2027-04-25 本館 4 室閉室整修。特別展另購票，特別展票當天可看常設展。
    price: "¥1,000"
    how: asoview 電子票（不指定日期，購買後 2 個月內有效；信用卡／PayPay／Paidy），或正門窗口（信用卡、Suica 等 IC 卡、iD、WAON、銀聯）。擁擠時窗口要排 30 分以上。
    url: https://www.tnm.jp/modules/r_free_page/index.php?id=113
  - item: 明治神宮（Meiji Jingū）
    detail: 參拜免費。開門隨日出日落變動，3 月約 5:40 開、17:20 關（4 月為 5:10～17:50）。境內「明治神宮御苑」（清正井）另收維持協力金，3～10 月 9:00～16:30。
    price: 免費（御苑 ¥500）
    how: 御苑在入口付維持協力金
    url: https://www.meijijingu.or.jp/
  - item: 目黒川（Meguro River）
    detail: 沿岸步道免費，沒有門票。櫻花季週末人潮極多，沿河常有單向通行與禁止停留的管制。
    price: 免費
    how: "—"
    url: https://www.city.meguro.tokyo.jp/
  - item: 高徳院 鎌倉大仏（Kōtoku-in）
    detail: 不需預約。10～3 月 8:00～17:00、4～9 月 8:00～17:30，入場至閉門前 15 分；所以 3/31 前是 17:00 關。大佛胎内拝観全年 8:00～16:30（入場至 16:20）。境內禁止飲食與帶食物進入（僅可帶有蓋的寶特瓶、水壺），沒有垃圾桶；胎内禁止使用自拍棒。不能重複入場。
    price: "¥300＋胎内 ¥50＝¥350"
    how: 現場券売場；胎内費在胎内入口另付
    url: https://www.kotoku-in.jp/
  - item: 長谷寺（Hase-dera）
    detail: 一般期 8:00～16:30 受付（17:00 閉山）；4～6 月延長為 8:00～17:00（17:30 閉山）。3/27～3/31 屬一般期，16:30 前要進門。寵物須放入提籠。
    price: "¥400"
    how: 現場拝観受付
    url: https://www.hasedera.jp/guide/
  - item: 鶴岡八幡宮（Tsurugaoka Hachimangū）宝物殿
    detail: 參拜免費。宝物殿 9:00～16:00，原則無休（換展時休館）。
    price: 免費（宝物殿 ¥200）
    how: 現場
    url: https://www.hachimangu.or.jp/activity/facility/homotsuden.html
  - item: 江の島サムエル・コッキング苑・江の島シーキャンドル
    detail: 苑與シーキャンドル 9:00～20:00（最終入場 19:30）；江の島エスカー（戶外電扶梯，共 3 段）8:50～19:05。コッキング苑白天免費，只有舉辦夜間活動時 17:00 後收費（春季「江の島アートフェスティバル」4 月上旬才開始，3/27～3/31 通常不在活動期，但出發前再看）。シーキャンドル單買 ¥800、エスカー全區 ¥500。
    price: シーキャンドルセット券 ¥1,100（エスカー＋シーキャンドル）；江の島1day ¥1,550（再加岩屋）
    how: エスカー1区乗り場現場買（現金、信用卡、交通 IC 卡、PayPay），或官網連到的線上票。1day 另可在片瀬江ノ島観光案内所、藤沢市観光案内センター購買。
    url: https://enoshima-seacandle.com/tickets/
  - item: 千鳥ヶ淵ボート場（Chidorigafuchi Boat）
    detail: 目前正常營業（千代田區頁面 2026-07-15 更新）。平時 10:00～17:00，週一休，12～2 月冬休。2026 年 3/1 起漲價：觀櫻期 30 分 ¥1,500、60 分 ¥3,000（1 艘，手划船最多 3 人）。2026 年夜櫻打燈期（3/26～4/6）延長營業並每天開。北の丸側石牆有崩落風險，南側水域拉繩禁止進入。船上禁止飲食、飲酒；桟橋禁止拍照；行李只能帶手提的，現場不寄放。
    price: 1 艘 30 分 ¥1,500（2 人分攤每人 ¥750）
    how: 現場當日券排隊；或 2026 年新增的「スマートチケット」1 艘 1 小時 ¥12,000，在 WEBKET 刷信用卡事前購買、免排隊（2026 年 3/10～4/5 開賣）
    url: https://www.city.chiyoda.lg.jp/shisetsu/koen/chidorigafuchi-boat.html
  - item: teamLab Planets TOKYO DMM（選配）
    detail: 營運到 2027 年底。8:00～22:00（最終入館 21:00）。現場不賣票。入場時間是排隊時段，不是停留時間；需赤腳、水深到膝蓋，建議穿可捲到膝上的褲子（館內免費借短褲）。免費置物櫃尺寸 23×34×37 cm，行李箱放推車區上鋼索鎖。禁止 30 cm 以上自拍棒。
    price: 成人 ¥3,800 起（變動票價，依日期時段不同）
    how: 只能在官方チケットストア線上購買，可於入場開始 2 小時前改時段，最多 3 次；不可退票
    url: https://www.teamlab.art/jp/e/planets/
