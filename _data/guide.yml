- id: airport-rail
  label: 空港
  title: 落地成田，一張來回券把兩人直接送到新宿西口
  intro: 成田空港第2ターミナル地下就是 JR 與京成的車站，往新宿最省事的是 JR 特急「成田エクスプレス」（N'EX），不必轉車、行李有專用架。持外國護照可買 N'EX TOKYO Round Trip Ticket，14 天內去回各一次。想再省錢就搭京成アクセス特急轉都営新宿線，便宜一半但要轉乘、拖行李辛苦。
  verdict: 兩人帶大行李、住新宿西口：買 N'EX 來回券（每人 ¥5,200），比單程買兩次每人省 ¥1,460，也比 Skyliner 轉 JR 便宜又不用換車。
  figures:
  - img: "/assets/img/nex_train.jpg"
    caption: 成田エクスプレス（N'EX），新宿方向列車直達新宿站
  - img: "/assets/img/narita_t2_station.jpg"
    caption: 成田空港第2ターミナル地下的鐵路車站，JR 與京成驗票口並排
  - img: "/assets/img/skyliner.jpg"
    caption: 京成スカイライナー，只到日暮里與京成上野
  rows:
  - item: N'EX TOKYO Round Trip Ticket
    detail: 成田空港↔東京都區（新宿、渋谷、品川、東京、横浜等）去回各一次，14 天有效；去程須「機場→東京方向」、回程須「東京方向→機場」，順序不可顛倒；下 N'EX 後不出站可免費轉乘 JR 東日本在來線，出站即失效。限持非日本護照者，領票時須出示護照正本。普通車指定席免費劃位，綠色車廂不可用。
    price: "¥5,200（大人）／¥2,600（6–11 歲）"
    how: JR-EAST Train Reservation 網站線上購買，或抵達後於成田空港第1／第2・3ターミナル站的 JR EAST Travel Service Center 現場購買；領票只能在這兩站。
    url: https://www.jreast.co.jp/en/multi/pass/nex.html
  - item: N'EX 單程原價（成田空港→新宿，普通車指定席）
    detail: 乘車券＋特急券合計；成田空港→東京為 ¥3,140，到新宿／渋谷／品川為 ¥3,330；綠色車廂 ¥4,100。官方對照表：成田↔新宿來回原價 ¥6,660，來回券省約 22%。
    price: "¥3,330"
    how: 現場 JR 售票處、指定席售票機（有繁中介面、收信用卡），或 JR-EAST Train Reservation。
    url: https://www.jreast.co.jp/en/multi/nex/tickets/
  - item: 京成スカイライナー（成田空港→日暮里／京成上野）
    detail: 全車指定席，空港第2ビル→日暮里最快約 36 分；乘車券 ¥1,280（IC ¥1,267）＋ライナー券 ¥1,300。到新宿還要在日暮里轉 JR 山手線（約 ¥260），合計約 ¥2,840 且須拖行李轉乘。
    price: "¥2,580（到日暮里）"
    how: 成田空港第1／第2・3ターミナル站 Skyliner 售票櫃台、京成資訊中心；或京成官方 Skyliner e-ticket 網站線上預購（有線上折扣價，金額未查證）。
    url: https://www.keisei.co.jp/keisei/tetudou/skyliner/us/skyliner/purchase.php
  - item: 京成アクセス特急＋都営新宿線（最便宜鐵路）
    detail: 空港第2ビル搭京成成田スカイアクセス線アクセス特急，直通都営浅草線到東日本橋，站內步行轉馬喰横山搭都営新宿線到新宿；約 1 小時 26 分、轉 1 次，不需特急券。
    price: "¥1,480（車票；Yahoo!乗換案内 2026-10 查詢）"
    how: 直接刷 IC 卡進站，或在京成售票機買到新宿的車票。
    url: https://transit.yahoo.co.jp/
  - item: 利木津巴士（Airport Limousine Bus）成田→新宿地區
    detail: 停靠新宿站西口京王百貨店前、バスタ新宿，以及京王プラザ、ハイアット リージェンシー、ヒルトン東京、ワシントンホテル等西新宿飯店；行李交給司機放車底，不必自己扛。
    price: "¥3,600（大人）／¥1,800（兒童）"
    how: 官方網站線上購票（信用卡，上車出示 QR 票），或抵達當天在機場入境大廳的巴士售票櫃台／售票機買指定班次票（現金、信用卡，櫃台可用 IC 卡）。
    url: https://www.limousinebus.co.jp/en/line/detail/Narita-Shinjuku/
  steps_title: N'EX 來回券線上購買與機場領票步驟
  steps:
  - 出發前 1 個月內，打開 JR-EAST Train Reservation（https://www.eki-net.com/en/jreast-train-reservation/Top/Index），右上角可切換語言（有繁體中文）。
  - 首頁點「Purchase a pass」（パスの購入），在列表中選「N'EX TOKYO Round Trip Ticket」，按「Purchase this pass」。
  - 系統要求登入；沒有帳號就在登入畫面選新會員註冊（Email、密碼），完成後會自動回到購買流程。
  - 輸入使用人數（一次最多 6 人；兩人一起買，日後劃位會綁同一行程）與使用開始日（填 2027-03-27）。購買後人數與開始日不能改，只能退票重買。
  - 依序填每位旅客的姓名、出生年、護照發行國、護照號碼；姓名中間不能有空格，要連在一起打。
  - 確認票種與價格（¥5,200×2）後按「Next」，勾選同意服務條款與隱私政策，再按「Next」。
  - 輸入信用卡資料後按「Apply」（申し込む）完成付款。
  - 完成頁有「Reserve outbound seat」（往路の指定席を予約する）與「Reserve return seat」（復路の指定席を予約する）：去程選 3/27 抵達後的班次（成田空港第2・3ターミナル→新宿），回程選 3/31 15:30 左右新宿發的班次，兩人座位一起選。普通車指定席不加價。
  - 同一頁按「Show QR code」，把領票用 QR code 截圖存手機；之後也可以在網站「申込履歴」裡再叫出來。
  - 抵達成田後從第2ターミナル入境大廳往 B1 走到 JR 車站，找有護照讀取器的「指定席券売機」（黑色標誌，6:30–21:45），或 JR EAST Travel Service Center（8:30–20:00）。兩人必須同時在場、帶護照正本。
  - 售票機選右側「QR code or pickup code」，把手機 QR code 對準右下角鏡頭（讀不到就按「Enter pickup code」輸入最多 17 位的取票碼，或插入購買時用的信用卡）。
  - 確認內容後按「Issue tickets for this reservation」，依畫面掃描護照，機器會吐出來回券與指定席券；每人一套，回程那張要收好到最後一天。
  tips:
  - 來回券的回程不必從新宿上車，但一定要是「東京方向→成田」；第 5 天從新宿 15:30 上車前，記得把票插進 JR 驗票閘門，不是刷 IC 卡。
  - 劃了位卻不搭，一定要上網取消；列車開出後不能退票。
  - N'EX 大行李區免預約、先到先放，有轉盤式密碼鎖；滿了就放腳邊或頭上行李架。
  - 官方公告 2026-11-06～11-08 部分 N'EX 停駛，與本行程無關，但出發前仍建議看一次 JR 東日本營運公告。
