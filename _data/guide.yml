- id: ic-card
  label: IC
  title: 一張 Suica 走遍東京，iPhone 甚至不用排隊
  intro: 東京的電車、地鐵、巴士、便利商店都吃同一種 IC 卡。2023 年缺晶片停售的實體 Suica／PASMO，已於 2025-03-01 恢復販售；給觀光客的 Welcome Suica 免押金、可用 28 天。iPhone 使用者可直接在錢包 App 開一張，或下載 JR 東日本的 Welcome Suica Mobile。
  verdict: iPhone 用 Welcome Suica Mobile 或錢包內建 Suica 最省事；Android 或想要實體卡的人，在成田第2・3ターミナル站買 Welcome Suica，每人先儲值 ¥3,000。
  figures:
  - img: "/assets/img/suica_card.jpg"
    caption: Suica 卡，進出站輕觸感應區即可
  - img: "/assets/img/ticket_gate.jpg"
    caption: 自動驗票閘門，IC 卡碰右手邊的藍色感應面
  rows:
  - item: Welcome Suica（實體卡）
    detail: 觀光客專用，不收押金、購買日起 28 天有效；餘額不能退，用完或到期就算了。可搭東京都內電車、地鐵、巴士、東京單軌電車，也能在便利商店、自動販賣機、置物櫃付款。不能跨區連續搭乘（例如東京區搭到仙台區）。
    price: 免押金；儲值額依購買時選擇
    how: 成田空港第2・3ターミナル站的 Welcome Suica 售票機、JR EAST Travel Service Center；東京、渋谷、新宿、池袋、上野站的 Travel Service Center 也有賣。
    url: https://www.jreast.co.jp/en/multi/welcomesuica/purchase.html
  - item: 一般 Suica（實體卡）
    detail: 2025-03-01 起無記名卡恢復販售。購買金額含 ¥500 押金，可選 ¥1,000～¥10,000；餘額上限 ¥20,000。實體卡只能用現金在車站售票機、精算機加值，不能刷信用卡加值。
    price: "¥1,000 起（含押金 ¥500）"
    how: JR 東日本車站售票機（購買地點官方英文頁未逐站列出）。
    url: https://www.jreast.co.jp/en/multi/pass/suica.html
  - item: Welcome Suica Mobile（iPhone App）
    detail: JR 東日本官方 App，只有 iOS 版。在 App 裡發行 Suica，用 Apple Pay 綁定的信用卡加值，App 內不必另外輸入卡號；也能用 App 搭 JR 東日本區域新幹線自由席。必須開啟定位，部分國家限制發行或加值，官方建議入境日本後再試。
    price: App 免費；儲值金額自選
    how: App Store 搜尋「Welcome Suica Mobile」下載，入境後開啟定位再發卡。
    url: https://www.jreast.co.jp/en/multi/welcomesuicamobile/
  - item: iPhone 錢包內建 Suica
    detail: 不裝 App 也可以：Wallet 直接新增 Suica。需 iPhone 8 以後機型、Apple 帳號開啟雙重認證、錢包裡有可用的付款卡。第一張交通卡會自動開啟快速交通卡模式，鎖定畫面也能直接刷。
    price: 儲值金額自選
    how: Wallet → 右上角「+」→ Transit Card → Suica → Add New Card → 選金額 → Apple Pay 付款。
    url: https://support.apple.com/en-us/108772
  - item: Android 手機
    detail: Welcome Suica Mobile 沒有 Android 版。台灣買的 Android 手機多半沒有日本規格 FeliCa 晶片，無法使用 Google 錢包的 Suica（未逐一查證機型）。
    price: "-"
    how: 直接買實體 Welcome Suica 或一般 Suica。
    url: https://www.jreast.co.jp/en/multi/welcomesuicamobile/
  - item: 加值與退卡
    detail: 實體卡：車站售票機或精算機選「Charge」，只收現金，¥500／1,000／2,000／3,000／5,000／10,000 為單位。一般 Suica 在 JR 東日本車站退卡：退 ¥500 押金＋餘額，但扣 ¥220 手續費（例：餘額 ¥1,000 退 ¥1,280）。Welcome Suica 不退餘額，最後幾天把餘額花在便利商店最划算。
    price: 退卡手續費 ¥220（一般 Suica）
    how: 退卡找 JR 東日本車站窗口；東京單軌電車等他社發行的 Suica 不能在 JR 退。
    url: https://www.jreast.co.jp/en/multi/pass/suica.html
  steps_title: iPhone 在錢包加入 Suica 的步驟
  steps:
  - 確認 iPhone 是 8 以後機型、iOS 是最新版、Apple 帳號已開雙重認證，錢包裡已有一張信用卡。
  - 打開「錢包」App，點右上角「+」。
  - 選「交通卡」（Transit Card），在清單裡點「Suica」。
  - 點「新增卡片」（Add New Card），選要儲值的金額後按「新增」。
  - 依畫面用 Face ID／Touch ID 以 Apple Pay 付款，出現「卡片已加入」就完成；第一張交通卡會自動設為快速交通卡。
  - 進站時不用解鎖、不用開 App，把 iPhone 上緣靠近閘門感應區即可；餘額不足時在錢包點 Suica →「儲值」再加。
  - 另一個做法：下載 Welcome Suica Mobile，入境日本後開啟定位，在 App 內設定一組通關字（secret keyword）發卡，再用 Apple Pay 儲值，卡片會自動放進錢包。
  tips:
  - 兩人各用一張卡，不能一張卡刷兩次進站；同行者不能共用一支手機的 Suica。
  - Apple Watch 版 Suica 若手錶不是日本購買的機型，官方註明可能不支援，請以 iPhone 為主。
  - 實體 Welcome Suica 沒有押金，退不回餘額；最後一天先在 7-Eleven、全家用 Suica 付零食，把錢花完再去機場。
  - 精算機（のりこし精算機）在驗票閘門內側，卡被閘門擋下顯示餘額不足時，到這台加值後再出站。
  sources:
  - name: JR東日本 What's a Suica
    url: https://www.jreast.co.jp/en/multi/suica/
  - name: JR東日本 Suica（押金、加值、退卡）
    url: https://www.jreast.co.jp/en/multi/pass/suica.html
  - name: JR東日本 Welcome Suica
    url: https://www.jreast.co.jp/en/multi/welcomesuica/welcomesuica.html
  - name: JR東日本 Welcome Suica 購買地點
    url: https://www.jreast.co.jp/en/multi/welcomesuica/purchase.html
