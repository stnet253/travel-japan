- id: ride-howto
  label: 乗車
  title: 看懂月台、記住末班車，東京電車其實很好搭
  intro: 東京的車站標示都有英文、多數也有中文，只要記住「路線顏色＋路線代號＋終點站」三件事就不會坐錯。這一節整理售票機切語言、刷卡過閘門、找月台與轉乘、末班車時間，以及大行李怎麼處理。
  verdict: 出門前用 Google Maps 查好路線與月台號，全程刷 IC 卡；晚上 23:30 以後回新宿就要開始注意末班車。
  figures:
  - img: "/assets/img/ticket_gate.jpg"
    caption: 自動驗票閘門，綠燈箭頭可通行，紅色禁止符號不能走
  - img: "/assets/img/shinjuku_sta.jpg"
    caption: 新宿站內以顏色區分各路線，跟著色帶走最不容易迷路
  - img: "/assets/img/enoden.jpg"
    caption: 江ノ電有人站要走站員窗口，不走自動閘門
  rows:
  - item: 售票機切中文
    detail: JR 指定席售票機官方支援英文、簡體中文、繁體中文、韓文，收 ¥1,000／2,000／5,000／10,000 紙鈔與信用卡。一般車票售票機與地鐵售票機畫面右上角通常有「English／中文」按鈕。
    price: "-"
    how: 畫面右上角點語言按鈕；有 IC 卡就不必買單程票。
    url: https://www.jreast.co.jp/en/multi/nex/tickets/
  - item: IC 卡過閘門
    detail: 進站與出站都把卡（或 iPhone）輕觸閘門右側感應面，聽到「嗶」、看到餘額即可通過；出站時自動扣款。坐特急（N'EX、ロマンスカー）或綠色車廂要另買特急券。
    price: 依 IC 運賃自動扣款
    how: 一人一卡，不要兩人共用。
    url: https://www.jreast.co.jp/en/multi/pass/suica.html
  - item: 看月台與轉乘
    detail: 站內看板以路線顏色＋代號（例：銀座線 G、丸ノ内線 M、大江戸線 E、新宿線 S、JR 山手線 JY）標示，再看「往○○方面」決定月台。轉乘跟著寫「乗換／Transfer」與目標路線顏色的指標走；都営與東京メトロ互轉若要通過站內的「乗換改札」（轉乘專用閘門），IC 卡照刷即可，不會重複收起跳費。
    price: "-"
    how: 上車前看月台電子看板的終點站與「各停／快速／急行」字樣。
    url: https://www.tokyometro.jp/tcn/ticket/travel/index.html
  - item: 末班車大約時間
    detail: 以平日為例（2026-10 時刻表）：浅草→新宿最晚約 00:10 發（銀座線轉 JR，00:53 到新宿）；都営浅草線轉都営新宿線約 23:57 發、00:29 到新宿。多數路線末班在 00:00～00:30 之間，週末與 2027-03 改點後可能不同。
    price: "-"
    how: Google Maps 或 Yahoo!乗換案内把出發時間設成「終電」查詢。
    url: https://transit.yahoo.co.jp/
  - item: Google Maps 轉乘
    detail: 目的地輸入日文或英文站名，選「大眾運輸」圖示，會列出搭乘路線、月台號、所需時間與票價；點路線可看幾號出口。金額為參考值，以 IC 運賃為準。
    price: "-"
    how: 出發前先把各日目的地存成「已儲存」地點，到現場一鍵導航。
    url: https://www.google.com/maps
  - item: 大行李上車規定（JR 東日本）
    detail: 免費，每人最多 2 件，三邊和 250 cm 以內、每件 30 kg 以內、長度 2 m 以內；放頭上行李架、腳邊或行李區，免預約。東海道新幹線特大行李預約規定不適用本行程。N'EX 有專用行李區與轉盤式密碼鎖。
    price: 免費
    how: 上 N'EX 先把行李鎖在車門旁行李區，再去對號入座。
    url: https://www.jreast.co.jp/en/multi/luggage-area/
  - item: 行李宅配（ヤマト運輸 空港宅急便）
    detail: 可把行李從機場寄到飯店，或從飯店寄回機場；每件 30 kg 以內。寄到機場須出發前 2 天（部分地區 3 天）交寄，運費另加機場手續費 ¥660。費用依行李尺寸（60～200 cm 級距）與起訖地區計算。
    price: 依尺寸計價（官方網頁需互動查詢，金額未取得）
    how: 成田空港入境大廳的ヤマト（黑貓）櫃台填單交寄；從飯店寄回機場可請櫃台協助。
    url: https://www.kuronekoyamato.co.jp/ytc/en/send/services/airport/
  steps_title: 第一次搭東京電車的流程
  steps:
  - 出門前在 Google Maps 輸入目的地，選大眾運輸，記下路線名稱、顏色、往哪個終點方向、預計月台號。
  - 到站後找路線顏色的指標走到驗票閘門，IC 卡碰右側感應面進站。
  - 看月台號與電子看板上的終點站，確認是「各停」還是「快速／急行」，快車會跳過小站。
  - 上車後看車門上方螢幕（有英文，部分有中文）確認下一站；要轉乘就在站內跟著「乗換／Transfer」走，不必出站。
  - 到站後看出口編號（例：A3、西口）再出閘門，IC 卡碰一下自動扣款；餘額不足時閘門會擋下，到旁邊的精算機加值。
  tips:
  - 新宿站很大，回飯店前先確認要走「西口」；從都営新宿線或大江戸線出來，跟著「新宿西口」或「都庁前」方向指標。
  - 早上 07:30～09:30 通勤尖峰，帶大行李盡量避開；第 5 天搭 N'EX 前，15:00 以前就該回到新宿站。
  - 電車上不講電話，手機轉靜音；後背包上車改背在胸前或放行李架。
  - Yahoo!乗換案内與 Google Maps 都能把時間設成「終電」，晚上去淺草、秋葉原，回程最好在 23:00 前出發。
  sources:
  - name: JR東日本 Oversized Luggage Guide
    url: https://www.jreast.co.jp/en/multi/luggage-area/
  - name: JR東日本 N'EX 購票（指定席售票機語言、付款）
    url: https://www.jreast.co.jp/en/multi/nex/tickets/
  - name: JR東日本 Suica 使用方式
    url: https://www.jreast.co.jp/en/multi/pass/suica.html
