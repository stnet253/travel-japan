# 由研究結果合併，需外部查證的指南內容（2026-10-16 查詢）
title: 交通・票券・購票指南
lede: 從訂機票、入境、買車票、刷卡進站、買門票，到回程退稅與登機，每一步都寫到「按哪個按鈕」。所有價格與規則皆於 2026-10-16 查官方來源，出發前一個月請再對照最後一段的待確認清單。
checked: '2026-10-16'
sections:
- id: flight
  label: 航空
  title: 從桃園飛成田，先看清楚你的航空公司停哪一棟航廈
  intro: 台北桃園 TPE 飛成田 NRT 的直飛選擇很多，傳統航空與廉航都有。成田有三座航廈（T1／T2／T3），同一條航線不同公司停的航廈不同，訂票時就要記下來，回程走錯航廈最花時間。本行程預設 2027-03-27（六）上午抵達 T2，所以優先看停 T2 的航空公司。
  verdict: 櫻花季票價會漲，建議出發前 3～5 個月（2026-10 至 2026-12）鎖定 T2 的華航、星宇、日航或虎航，廉航記得把行李費一起算進去比價。
  figures:
  - img: "/assets/img/narita.jpg"
    caption: 成田國際空港。台北線分散在 T1、T2、T3 三棟航廈。
  rows:
  - item: 中華航空 China Airlines（CI）
    detail: 傳統航空，成田國際線在 T2 3F 報到。
    price: 經濟艙來回約 NT$12,000～20,000（估計，2026-10-16 查詢，櫻花季可能更高）
    how: 官網或旅行社訂票；含託運行李。
    url: https://www.narita-airport.jp/ja/flight/airline-search/cal/
  - item: 長榮航空 EVA Air（BR）
    detail: 傳統航空，成田國際線在 T1（不是 T2）。
    price: 經濟艙來回約 NT$12,000～20,000（估計，2026-10-16 查詢）
    how: 官網訂票；若選長榮，抵達是 T1，N'EX 改在「成田空港」站（T1 地下）上車。
    url: https://www.narita-airport.jp/ja/flight/airline-search/eva/
  - item: 星宇航空 STARLUX（JX）
    detail: 傳統航空，成田國際線在 T2 3F。
    price: 經濟艙來回約 NT$13,000～22,000（估計，2026-10-16 查詢）
    how: 官網訂票；含託運行李。
    url: https://www.narita-airport.jp/ja/flight/airline-search/sjx/
  - item: 日本航空 JAL（JL）
    detail: 傳統航空，成田國際線在 T2 3F。
    price: 經濟艙來回約 NT$12,000～20,000（估計，2026-10-16 查詢）
    how: 官網訂票。
    url: https://www.narita-airport.jp/ja/flight/airline-search/jal/
  - item: 台灣虎航 Tigerair Taiwan（IT）
    detail: 廉航，成田國際線在 T2 3F。基本票價不含託運行李；手提行李規則請以官網為準（第三方整理為 2 件合計 10kg）。
    price: 基本票來回約 NT$6,000～12,000，另加行李費（估計，2026-10-16 查詢）
    how: 官網訂票時就加購託運行李，比機場現場便宜。
    url: https://www.tigerairtw.com/zh-tw/ready-to-go/fees
  - item: 樂桃 Peach（MM）
    detail: 廉航，成田國際線在 T1 北ウイング 4F。
    price: 基本票來回約 NT$6,000～12,000，另加行李費（估計，2026-10-16 查詢）
    how: 託運行李加購必須在原定起飛 1 小時前完成；完成報到後就無法上網加購。
    url: https://www.flypeach.com/tw/lm/ai/airports/baggage/checked_in_bag
  - item: 捷星日本 Jetstar Japan（GK）
    detail: 廉航，成田國際線在 T3 2F。KAYAK 顯示近期有執飛 TPE–NRT。
    price: KAYAK 標示來回一般約 US$269～430（估計，2026-10-16 查詢）
    how: 官網訂票；T3 離 N'EX 車站最遠，回程要多抓 15 分鐘。
    url: https://www.narita-airport.jp/ja/flight/airline-search/jjp/
  - item: 松山 TSA ⇄ 羽田 HND（參考）
    detail: 另有台北松山飛羽田的航線，羽田離市區較近。但本行程以成田為準，已規劃 N'EX 與新宿西口住宿動線，不建議中途改機場。
    price: 通常比成田線貴（估計）
    how: 若真要改羽田，交通段需整段重排。
    url: https://www.narita-airport.jp/ja/flight/airline-search/
  steps_title: 訂票前三件事
  steps:
  - 打開 Google Flights 或 Skyscanner，日期填 2027-03-27 去程（上午抵達）、2027-03-31 回程（約 20:00 起飛），先看哪些航班有、價差多少。
  - 把候選航班的公司名稱對照成田官網「航空会社一覧」，確認停的是 T1、T2 還是 T3（本頁表格已列出），選 T2 最符合本行程。
  - 廉航請在付款頁把「託運行李」勾起來再比價，兩人來回的行李費加上去，常常和傳統航空差不到多少。
  - 回官網直接訂（不要在比價網的第三方代理付款），訂完把電子機票 PDF 存到手機，Visit Japan Web 填寫時會用到航班編號。
  tips:
  - 長榮停 T1、華航和星宇停 T2，兩家台灣大公司不在同一棟，朋友若分別訂票，回程集合點要先講好。
  - 廉航的「手提 10kg」通常是兩件加起來，回程裝了藥妝零食很容易超重，在機場加購最貴。
  - 3 月底是日本櫻花季加上台灣春假前後，票價波動大，看到合理價格就先訂。
