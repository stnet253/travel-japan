# 天氣：Open-Meteo 再分析資料，東京 3/25–3/31 兩年實測（2026-10-16 查詢）
weather:
  summary: 白天 13–20°C、清晨與夜間 5–11°C；兩年中有一半的日子出現毛毛雨或小雨，晴天與陰雨交替，日夜溫差可達 10°C。
  table:
    - { date: "3/27", y2025: "11–21°C 陰", y2026: "9–16°C 小雨轉晴" }
    - { date: "3/28", y2025: "15–23°C 陰雨", y2026: "9–17°C 晴" }
    - { date: "3/29", y2025: "6–14°C 毛毛雨", y2026: "11–19°C 晴" }
    - { date: "3/30", y2025: "5–13°C 陰", y2026: "12–18°C 陰" }
    - { date: "3/31", y2025: "4–8°C 陰雨", y2026: "16–19°C 小雨" }
  clothing:
    - 洋蔥式三層：發熱衣或薄長袖 ＋ 針織衫或刷毛 ＋ 防風薄外套（風衣或輕羽絨）
    - 一條圍巾，晚上江の島與都廳展望台外風大，5°C 體感很冷
    - 摺疊傘必帶，兩年內行程日有一半下雨；鞋子選好走且不怕濕的
    - 每天步行 8–12 公里，鎌倉當天最多，襪子多帶一雙
    - 花粉季：鼻子敏感的人帶口罩與抗過敏藥
    - 日落約 18:00，夜櫻拍照手機夠用，但帶行動電源

